<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>日常目標集點卡 — 喝咖啡・健身・跑步</title>
  <style>
    :root {
      /* 參考圖湖水綠柔和背景與全域色票 */
      --bg-canvas: #d6eeee;
      --bg-canvas-grad: radial-gradient(circle at 20% 20%, #e3f6f6 0%, #d2ebeb 55%, #c6e4e4 100%);
      --tool-btn-bg: #ffffff;
      --tool-btn-text: #4a5557;
      --tool-btn-shadow: 0 10px 24px rgba(58, 98, 102, 0.14), 0 2px 6px rgba(58, 98, 102, 0.08);
      --card-shadow: 0 20px 45px rgba(42, 77, 80, 0.16), 0 4px 12px rgba(42, 77, 80, 0.08);

      /* 主題 1：莫蘭迪青綠（右上：微微飲品 / 喝咖啡） */
      --coffee-bg: #9ab9b5;
      --coffee-bg-dark: #7fa19c;
      --coffee-ink: #ffffff;
      --coffee-slot-bg: #ffffff;
      --coffee-stamp: #6f4e37;

      /* 主題 2：暖陽銘黃（左上：健康餐盒 / 健身） */
      --fitness-bg: #f6cb52;
      --fitness-inner: #ffffff;
      --fitness-ink: #3d3522;
      --fitness-slot-bg: #dfCFAf;
      --fitness-stamp: #e0533c;

      /* 主題 3：焦糖烘焙（右下：微微烘焙坊 / 跑步） */
      --running-header: #b8732a;
      --running-bg: #f5ebe1;
      --running-ink: #8a5620;
      --running-slot-bg: #ffffff;
      --running-stamp: #c86428;

      /* 主題 4：灰藍撞色花朵（左下：集點卡 / 自訂習慣） */
      --floral-left: #8eaec0;
      --floral-right: #ccd5db;
      --floral-ink: #4f626d;
      --floral-slot-bg: #b8c4cc;
      --floral-stamp: #d96b70;

      --font-sans: "PingFang TC", "Heiti TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-rounded: "jf-openhuninn", "PingFang TC", "Hiragino Maru Gothic ProN", "YouYuan", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg-canvas-grad);
      font-family: var(--font-sans);
      color: #2f3e40;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: calc(20px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) calc(20px + env(safe-area-inset-left, 0px));
      overflow-x: hidden;
    }

    /* 頂部標題與單卡切換 Tabs */
    .app-header {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 24px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      background: #ffffff;
      color: #3f6d70;
      font-weight: 700;
      font-size: 13px;
      padding: 5px 12px;
      border-radius: 999px;
      box-shadow: 0 4px 12px rgba(58, 98, 102, 0.1);
      letter-spacing: 0.5px;
    }

    .brand-title h1 {
      font-size: 20px;
      font-weight: 800;
      color: #2d4c4f;
      letter-spacing: 0.5px;
    }

    .card-tabs {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: rgba(255, 255, 255, 0.55);
      padding: 6px;
      border-radius: 18px;
      backdrop-filter: blur(8px);
      box-shadow: inset 0 1px 3px rgba(45, 76, 79, 0.08);
    }

    .card-tab {
      border: none;
      background: transparent;
      color: #466366;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      padding: 9px 16px;
      border-radius: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .card-tab:hover {
      background: rgba(255, 255, 255, 0.7);
      transform: translateY(-1px);
    }

    .card-tab.active {
      background: #ffffff;
      color: #233d40;
      box-shadow: 0 6px 16px rgba(45, 76, 79, 0.14);
    }

    .card-tab .tab-progress {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: #e6f2f2;
      color: #3f6d70;
    }

    .card-tab.active .tab-progress {
      background: #3f6d70;
      color: #ffffff;
    }

    .card-tab-add {
      border: 1.5px dashed #6b9699;
      background: rgba(255, 255, 255, 0.4);
      color: #385e61;
    }

    .card-tab-add:hover {
      background: #ffffff;
      border-style: solid;
    }

    /* 主舞台：左側懸浮圓角工具鈕 + 右側聚焦集點卡 */
    .stage-workspace {
      width: 100%;
      max-width: 960px;
      display: grid;
      grid-template-columns: 104px 1fr;
      gap: 28px;
      align-items: center;
      margin-top: 8px;
    }

    /* 復刻參考圖左側 3 顆白色立體圓角方鈕 */
    .left-toolbar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .tool-btn {
      width: 88px;
      height: 92px;
      border-radius: 22px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      background: var(--tool-btn-bg);
      box-shadow: var(--tool-btn-shadow);
      color: var(--tool-btn-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s ease;
    }

    .tool-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 14px 28px rgba(58, 98, 102, 0.2), 0 4px 10px rgba(58, 98, 102, 0.1);
    }

    .tool-btn:active {
      transform: translateY(0) scale(0.98);
    }

    .tool-btn.active-tool {
      outline: 3px solid #5a8f94;
      color: #2c5256;
    }

    .tool-btn svg {
      width: 30px;
      height: 30px;
      fill: currentColor;
    }

    /* 集點卡畫布外框 */
    .card-stage {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 通用集點卡本體（比例接近參考圖橫式商務集點卡 16:10） */
    .point-card {
      width: 100%;
      max-width: 760px;
      min-height: 455px;
      border-radius: 24px;
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      user-select: none;
    }

    /* ==========================================================
       主題 1：莫蘭迪青綠（右上「微微飲品」— 喝咖啡預設主題）
       ========================================================== */
    .point-card.theme-coffee {
      background: var(--coffee-bg);
      color: var(--coffee-ink);
      padding: 34px 44px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .theme-coffee .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      position: relative;
      z-index: 2;
    }

    .theme-coffee .title-group {
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
    }

    .theme-coffee .hand-title {
      font-family: var(--font-rounded);
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 8px;
      color: #ffffff;
      text-shadow: 0 2px 0 rgba(70, 96, 93, 0.25);
    }

    .theme-coffee .rule-box {
      border-left: 2px solid rgba(255, 255, 255, 0.65);
      padding-left: 16px;
      font-size: 15px;
      line-height: 1.65;
      color: rgba(255, 255, 255, 0.95);
      font-weight: 600;
      letter-spacing: 1px;
    }

    .theme-coffee .illust-cup {
      width: 78px;
      height: 92px;
      transform: rotate(10deg);
      filter: drop-shadow(0 6px 10px rgba(55, 80, 77, 0.2));
      flex-shrink: 0;
    }

    /* 咖啡杯造型集點格網格 */
    .theme-coffee .slots-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 18px 20px;
      margin: 18px 0 22px;
      position: relative;
      z-index: 2;
    }

    .slot-item {
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .slot-item:hover {
      transform: translateY(-4px) scale(1.04);
    }

    .theme-coffee .cup-slot-svg {
      width: 100%;
      max-width: 108px;
      height: auto;
      filter: drop-shadow(0 4px 8px rgba(64, 92, 89, 0.18));
    }

    .slot-meta-badge {
      position: absolute;
      bottom: -6px;
      background: rgba(45, 67, 65, 0.88);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
      max-width: 110px;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    /* 共同打卡成員右上角小徽章 */
    .slot-member-tag {
      position: absolute;
      top: -4px;
      right: 4px;
      background: #ffffff;
      color: #2b4547;
      font-size: 11px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.16);
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #95a5a6;
      display: inline-block;
    }

    .sync-dot.online {
      background: #2ecc71;
      box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.22);
    }

    .theme-coffee .card-footer {
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 2;
    }

    .qr-deco {
      width: 58px;
      height: 58px;
      background: #ffffff;
      border-radius: 8px;
      padding: 5px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .theme-coffee .footer-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.6px;
    }

    .theme-coffee .footer-top-line {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .theme-coffee .expiry-pill {
      background: #ffffff;
      color: #6b8c88;
      padding: 3px 16px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px;
    }

    /* ==========================================================
       主題 2：暖陽銘黃（左上「健康餐盒」— 健身預設主題）
       ========================================================== */
    .point-card.theme-fitness {
      background: var(--fitness-bg);
      color: var(--fitness-ink);
      padding: 28px 38px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .theme-fitness .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 8px;
    }

    .theme-fitness .title-cluster {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .theme-fitness .hand-title {
      font-size: 38px;
      font-weight: 900;
      color: #2f291c;
      letter-spacing: 4px;
      position: relative;
    }

    .theme-fitness .sub-slogan {
      font-size: 14px;
      font-weight: 800;
      line-height: 1.45;
      color: #4a3f23;
    }

    .theme-fitness .rule-pill-box {
      background: #ffffff;
      border-radius: 999px;
      padding: 8px 22px;
      text-align: center;
      position: relative;
      box-shadow: 0 4px 10px rgba(168, 127, 22, 0.15);
    }

    .theme-fitness .rule-pill-tag {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      background: #f6cb52;
      color: #2f291c;
      font-size: 11px;
      font-weight: 900;
      padding: 1px 10px;
      border-radius: 999px;
      border: 1.5px solid #2f291c;
    }

    .theme-fitness .rule-pill-text {
      font-size: 12.5px;
      font-weight: 700;
      color: #3d3522;
    }

    /* 白色圓角內框 + 邊緣手繪貼紙插圖 */
    .theme-fitness .white-board {
      background: var(--fitness-inner);
      border-radius: 22px;
      padding: 24px 28px;
      margin: 14px 0;
      position: relative;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .theme-fitness .sticker-left {
      position: absolute;
      top: -18px;
      left: -18px;
      width: 68px;
      height: 68px;
      pointer-events: none;
    }

    .theme-fitness .sticker-right {
      position: absolute;
      bottom: -14px;
      right: -18px;
      width: 72px;
      height: 72px;
      pointer-events: none;
    }

    .theme-fitness .slots-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px 22px;
      justify-items: center;
    }

    .theme-fitness .circle-slot {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: var(--fitness-slot-bg);
      color: #ffffff;
      font-size: 32px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: inset 0 2px 4px rgba(112, 93, 62, 0.16);
    }

    .theme-fitness .circle-slot.stamped {
      background: #fff3d1;
      border: 2.5px solid var(--fitness-stamp);
      color: var(--fitness-stamp);
    }

    .theme-fitness .card-footer {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 8px;
      font-size: 13px;
      font-weight: 700;
      color: #3d3522;
    }

    /* ==========================================================
       主題 3：焦糖烘焙（右下「微微烘焙坊」— 跑步預設主題）
       ========================================================== */
    .point-card.theme-running {
      background: var(--running-bg);
      color: var(--running-ink);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-bottom: 24px;
    }

    .theme-running .top-banner {
      background: var(--running-header);
      color: #ffffff;
      padding: 20px 38px;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 16px;
    }

    .theme-running .hand-title {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 5px;
    }

    .theme-running .eng-sub {
      font-size: 20px;
      font-weight: 600;
      opacity: 0.92;
      letter-spacing: 1.5px;
    }

    .theme-running .rule-bar {
      text-align: center;
      font-size: 14.5px;
      font-weight: 700;
      color: #8a5620;
      margin: 14px 0 10px;
      letter-spacing: 1.2px;
      position: relative;
    }

    .theme-running .ticket-grid-wrap {
      padding: 0 54px;
      position: relative;
    }

    .theme-running .sticker-shoe-left {
      position: absolute;
      left: 8px;
      bottom: -8px;
      width: 78px;
      height: 64px;
      pointer-events: none;
    }

    .theme-running .sticker-track-right {
      position: absolute;
      right: 12px;
      top: -26px;
      width: 68px;
      height: 68px;
      pointer-events: none;
    }

    .theme-running .slots-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: rgba(184, 115, 42, 0.18);
      gap: 3px;
      border: 3px solid rgba(184, 115, 42, 0.22);
      border-radius: 10px;
      overflow: hidden;
    }

    .theme-running .square-slot {
      background: var(--running-slot-bg);
      height: 92px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      color: #b58552;
      position: relative;
    }

    .theme-running .square-slot:hover {
      background: #fffdf9;
      transform: none;
    }

    .theme-running .card-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 14px 42px 0;
      font-size: 12.5px;
      font-weight: 700;
      color: #8a5620;
    }

    .theme-running .footer-divider {
      width: 2px;
      height: 32px;
      background: rgba(138, 86, 32, 0.35);
    }

    /* ==========================================================
       主題 4：灰藍撞色花朵（左下「集點卡」— 新增/切換模板可用）
       ========================================================== */
    .point-card.theme-floral {
      display: grid;
      grid-template-columns: 230px 1fr;
      background: var(--floral-right);
      color: var(--floral-ink);
    }

    .theme-floral .left-panel {
      background: var(--floral-left);
      color: #ffffff;
      padding: 36px 24px 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    .theme-floral .left-title h2 {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 4px;
      margin-bottom: 4px;
    }

    .theme-floral .left-title p {
      font-size: 16px;
      letter-spacing: 2px;
      opacity: 0.92;
    }

    .theme-floral .mascot-row {
      width: 150px;
      height: 54px;
      margin: 12px 0;
    }

    .theme-floral .left-qr-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.16);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      text-align: left;
      line-height: 1.45;
    }

    .theme-floral .right-panel {
      padding: 28px 36px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .theme-floral .member-fields {
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }

    .theme-floral .field-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
      color: #546772;
    }

    .theme-floral .field-pill {
      flex: 1;
      max-width: 240px;
      background: #ffffff;
      border-radius: 999px;
      padding: 5px 16px;
      font-size: 13px;
      color: #364954;
      font-weight: 700;
    }

    .theme-floral .slots-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px 22px;
      justify-items: center;
      margin: 12px 0;
    }

    .theme-floral .flower-slot-svg {
      width: 96px;
      height: 96px;
      filter: drop-shadow(0 4px 8px rgba(73, 94, 107, 0.12));
    }

    .theme-floral .right-footer {
      text-align: center;
      font-size: 13.5px;
      font-weight: 700;
      color: #546772;
      letter-spacing: 0.8px;
    }

    /* 卡片完成輪數與達成徽章 */
    .card-Floating-badges {
      width: 100%;
      max-width: 760px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .round-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.85);
      color: #2f5457;
      font-size: 13px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 999px;
      box-shadow: 0 4px 12px rgba(45, 76, 79, 0.08);
    }

    .redeem-banner-btn {
      border: none;
      background: linear-gradient(135deg, #f39c12, #e74c3c);
      color: #ffffff;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 800;
      padding: 7px 18px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(231, 76, 60, 0.32);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      animation: pulseBadge 1.6s infinite ease-in-out;
    }

    @keyframes pulseBadge {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .storage-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;

    /* 底部模板快速預覽切換列 */

    /* 蓋章動畫與印章通用樣式 */

      60% { transform: scale(0.88) rotate(5deg); opacity: 1; }
      82% { transform: scale(1.07) rotate(-2deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    @keyframes slotRipple {
      0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.55); }
      100% { box-shadow: 0 0 0 22px rgba(231, 76, 60, 0); }

    .stamp-anim {
      animation: stampPop 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .slot-item.just-stamped {
      animation: slotRipple 0.65s ease-out;
    }

    /* 音效開關膠囊鈕 */

      background: rgba(255, 255, 255, 0.88);
      color: #2f5457;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;

    .sound-toggle-btn:hover {
      background: #ffffff;
      transform: translateY(-1px);
    }

    /* ==========================================================
       Step 3：打卡備註彈窗 (Modal) & 慶祝紙花畫布
       ========================================================== */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .modal-backdrop {

    .modal-backdrop.open {
      display: flex;

    }

    .modal-card {
      width: 100%;

      background: #ffffff;
      border-radius: 24px;

    .modal-backdrop.open .modal-card {

    .celebration-toast {

  <!-- Step 4-C：左側「紀錄」按鈕 — 打卡歷史時間軸與備份還原彈窗 -->
  <div class="modal-backdrop" id="historyModalOverlay" role="dialog" aria-modal="true">

  <script>
    // =========================================================================
    // Step 2：資料模型與 LocalStorage 狀態管理 (HabitStore)
    // =========================================================================
    const STORAGE_KEY = 'HABIT_STAMP_APP_STATE_V1';
    const PROFILE_STORAGE_KEY = 'HABIT_STAMP_LOCAL_PROFILE_V1';

    // 每支手機獨立儲存的「我的打卡身分」與「雲端同步房間設定」
    const LocalProfile = {
      data: {
        avatar: '👩',
        name: '我',
        roomId: '',
        dbUrl: ''
      },
      init() {
        try {
          const raw = localStorage.getItem(PROFILE_STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && typeof parsed === 'object') {
              this.data = { ...this.data, ...parsed };
            }
          }
        } catch (e) {}

        // 若朋友點開邀請連結 (?room=...&db=...)，自動帶入共同房號與資料庫網址
        const params = new URLSearchParams(window.location.search);
        const urlRoom = params.get('room');
        const urlDb = params.get('db');
        if (urlRoom) this.data.roomId = urlRoom.trim();
        if (urlDb) this.data.dbUrl = urlDb.trim();
        if (urlRoom || urlDb) this.save();
      },
      save() {
        try {
          localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(this.data));
        } catch (e) {}
      }
    };

    function formatShortDate(dateObj = new Date()) {
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${m}/${d}`;
    }

    function formatFullDateTime(dateObj = new Date()) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      const hh = String(dateObj.getHours()).padStart(2, '0');
      const mm = String(dateObj.getMinutes()).padStart(2, '0');
      return `${y}/${m}/${d} ${hh}:${mm}`;
    }

    // 建立預設初始資料（包含喝咖啡、健身、跑步 3 張主題卡片與初始打卡紀錄）
    function createDefaultState() {
      return {
        version: '1.0',
        activeCardId: 'coffee',
        soundEnabled: true,
        lastSavedAt: formatFullDateTime(),
        cards: [
          {
            id: 'coffee',
            icon: '☕',
            tabName: '喝咖啡',
            title: '喝咖啡集點',
            engTitle: 'coffee point card',
            slogan: '每日一杯醇香時光\n手沖省錢好習慣',
            subtitle: '手沖或品嚐好咖啡得 1 點\n集滿 10 點獎勵買一包精品藝伎豆',
            rewardText: '集滿 10 點獎勵：購買一包喜歡的精品咖啡豆',
            expiry: '2026/12/31',
            scheduleText: '打卡時段：07:00-18:00',
            theme: 'coffee',
            totalSlots: 10,
            completedRounds: 1,
            quickTags: ['手沖耶加雪菲', '冰美式無糖', '熱燕麥拿鐵', '自帶杯折抵', '冷萃咖啡'],
            stamps: {
              1: { slot: 1, date: '11/20', fullTime: '2026/11/20 08:30', note: '手沖耶加' },
              2: { slot: 2, date: '11/21', fullTime: '2026/11/21 09:15', note: '冰美式' },
              3: { slot: 3, date: '11/23', fullTime: '2026/11/23 08:50', note: '燕麥拿鐵' }
            }
          },
          {
            id: 'fitness',
            icon: '🏋️',
            tabName: '健身',
            title: '集點卡',
            engTitle: 'WORKOUT PASS',
            slogan: '揮灑汗水練出線條\n你的強健好朋友',
            subtitle: '重訓或有氧滿 30 分鐘得 1 點，集滿 10 點獎勵運動新裝備',
            rewardText: '◀ 集滿 10 點獎勵：添購新運動服飾或享受大餐一頓',
            expiry: '2026/12/31',
            scheduleText: '訓練目標：每次 30~60 分鐘 / 重訓・核心・有氧',
            theme: 'fitness',
            totalSlots: 10,
            completedRounds: 2,
            quickTags: ['深蹲硬舉 45m', '胸背肌群訓練', '核心燃脂 30m', '壺鈴全身訓練', '瑜珈伸展'],
            stamps: {
              1: { slot: 1, date: '11/18', fullTime: '2026/11/18 19:20', note: '深蹲硬舉' },
              2: { slot: 2, date: '11/19', fullTime: '2026/11/19 20:00', note: '胸背45m' },
              3: { slot: 3, date: '11/21', fullTime: '2026/11/21 18:40', note: '核心訓練' },
              4: { slot: 4, date: '11/23', fullTime: '2026/11/23 19:10', note: '壺鈴燃脂' }
            }
          },
          {
            id: 'running',
            icon: '🏃',
            tabName: '跑步',
            title: '晨夜慢跑社',
            engTitle: 'running card',
            subtitle: '單次慢跑達 3 公里得 1 點，集滿 10 點獎勵新跑鞋基金',
            slogan: '邁開步伐迎著微風\n累積每一步里程',
            rewardText: '集滿 10 點獎勵：提撥 $1,000 跑鞋升級基金',
            expiry: '2026/12/31',
            scheduleText: '建議配速：輕鬆跑 Zone 2 ｜ 戶外河濱或跑步機皆可',
            theme: 'running',
            totalSlots: 10,
            completedRounds: 0,
            quickTags: ['晨跑 3km', '河濱夜跑 5km', '週末長跑 8km', '跑步機 30m', '間歇跑訓練'],
            stamps: {
              1: { slot: 1, date: '11/20', fullTime: '2026/11/20 21:00', note: '夜跑 5km' },
              2: { slot: 2, date: '11/22', fullTime: '2026/11/22 07:15', note: '晨跑 8km' }
            }
          }
        ],
        history: [
          { id: 'h1', cardId: 'coffee', cardTitle: '☕ 喝咖啡集點', type: 'stamp', slot: 3, date: '11/23', fullTime: '2026/11/23 08:50', note: '燕麥拿鐵' },
          { id: 'h2', cardId: 'fitness', cardTitle: '🏋️ 集點卡', type: 'stamp', slot: 4, date: '11/23', fullTime: '2026/11/23 19:10', note: '壺鈴燃脂' },
          { id: 'h3', cardId: 'running', cardTitle: '🏃 晨夜慢跑社', type: 'stamp', slot: 2, date: '11/22', fullTime: '2026/11/22 07:15', note: '晨跑 8km' }
        ]
      };
    }

    const HabitStore = {
      state: null,

      init() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.cards) && parsed.cards.length > 0) {
              this.state = parsed;
              return;
            }
          }
        } catch (err) {
          console.warn('讀取 LocalStorage 失敗，使用預設資料：', err);
        }
        this.state = createDefaultState();
        this.save(false);
      },

      save(pushCloud = true) {
        this.state.lastSavedAt = formatFullDateTime();
        if (pushCloud) {
          this.state.updatedAt = Date.now();
        }
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
        } catch (err) {
          console.error('寫入 LocalStorage 失敗：', err);
        }
        if (pushCloud && typeof CloudSync !== 'undefined') {
          CloudSync.push();
        }
      },

      getCards() {
        return this.state.cards;
      },

      getActiveCard() {
        return this.state.cards.find(c => c.id === this.state.activeCardId) || this.state.cards[0];
      },

      setActiveCard(cardId) {
        if (this.state.cards.some(c => c.id === cardId)) {
          this.state.activeCardId = cardId;
          this.save(false);
        }
      },

      getStampCount(card) {
        return Object.keys(card.stamps || {}).filter(k => Number(k) <= card.totalSlots).length;
      },

      isCardCompleted(card) {
        return this.getStampCount(card) >= card.totalSlots;
      },

      setCardTheme(cardId, theme) {
        const card = this.state.cards.find(c => c.id === cardId);
        if (!card) return;
        card.theme = theme;
        this.save(true);
      },

      toggleSound() {
        this.state.soundEnabled = !this.state.soundEnabled;
        this.save(false);
        return this.state.soundEnabled;
      },

      stampSlot(cardId, slotIndex, noteText = '', customDate = '') {
        const card = this.state.cards.find(c => c.id === cardId);
        if (!card) return null;
        const now = new Date();
        const isUpdate = Boolean(card.stamps[slotIndex]);
        const byIcon = LocalProfile.data.avatar || '👩';
        const byName = LocalProfile.data.name || '我';
        const entry = {
          slot: Number(slotIndex),
          date: (customDate || '').trim() || (card.stamps[slotIndex]?.date) || formatShortDate(now),
          fullTime: card.stamps[slotIndex]?.fullTime || formatFullDateTime(now),
          note: noteText.trim() || card.quickTags?.[0] || '打卡完成',
          byIcon,
          byName
        };
        card.stamps[slotIndex] = entry;

        this.state.history.unshift({
          id: 'h_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          cardId: card.id,
          cardTitle: `${card.icon} ${card.tabName}`,
          type: isUpdate ? 'edit' : 'stamp',
          slot: Number(slotIndex),
          date: entry.date,
          fullTime: formatFullDateTime(now),
          note: `${byIcon} ${byName}：${entry.note}`
        });
        this.save(true);
        return entry;
      },

      unstampSlot(cardId, slotIndex) {
        const card = this.state.cards.find(c => c.id === cardId);
        if (!card || !card.stamps[slotIndex]) return false;
        const removed = card.stamps[slotIndex];
        delete card.stamps[slotIndex];

        this.state.history.unshift({
          id: 'h_' + Date.now(),
          cardId: card.id,
          cardTitle: `${card.icon} ${card.tabName}`,
          type: 'unstamp',
          slot: Number(slotIndex),
          date: formatShortDate(),
          fullTime: formatFullDateTime(),
          note: `取消第 ${slotIndex} 格（原備註：${removed.note || '無'}）`
        });
        this.save(true);
        return true;
      },

      redeemCard(cardId) {
        const card = this.state.cards.find(c => c.id === cardId);
        if (!card) return false;
        card.completedRounds = (card.completedRounds || 0) + 1;
        card.stamps = {};
        this.state.history.unshift({
          id: 'h_' + Date.now(),
          cardId: card.id,
          cardTitle: `${card.icon} ${card.tabName}`,
          type: 'redeem',
          slot: card.totalSlots,
          date: formatShortDate(),
          fullTime: formatFullDateTime(),
          note: `🎉 完成第 ${card.completedRounds} 張卡並兌換獎勵：${card.rewardText}`
        });
        this.save(true);
        return true;
      },

      addCard(payload) {
        const newId = 'card_' + Date.now();
        const newCard = {
          id: newId,
          icon: payload.icon || '🌸',
          tabName: payload.tabName || payload.title || '新目標',
          title: payload.title || '日常目標集點',
          engTitle: payload.engTitle || 'habit point card',
          slogan: payload.slogan || '日日累積小進步\n養成理想好習慣',
          subtitle: payload.subtitle || '每次完成目標得 1 點，集滿即可兌換專屬獎勵',
          rewardText: payload.rewardText || '集滿獎勵：犒賞自己一份喜歡的禮物',
          expiry: payload.expiry || '2026/12/31',
          scheduleText: payload.scheduleText || '打卡時段：全天皆可紀錄',
          theme: payload.theme || 'floral',
          totalSlots: Number(payload.totalSlots) || 6,
          completedRounds: 0,
          quickTags: payload.quickTags && payload.quickTags.length ? payload.quickTags : ['今日達標', '狀況極佳', '持續堅持'],
          stamps: {}
        };
        this.state.cards.push(newCard);
        this.state.activeCardId = newId;
        this.save(true);
        return newCard;
      },

      updateCardSettings(cardId, payload) {
        const card = this.state.cards.find(c => c.id === cardId);
        if (!card) return null;
        card.icon = payload.icon || card.icon;
        card.tabName = payload.tabName || card.tabName;
        card.title = payload.title || card.title;
        card.expiry = payload.expiry || card.expiry;
        card.totalSlots = Number(payload.totalSlots) || card.totalSlots;
        card.theme = payload.theme || card.theme;
        card.subtitle = payload.subtitle || card.subtitle;
        card.rewardText = payload.rewardText || card.rewardText;
        if (payload.quickTags && payload.quickTags.length > 0) {
          card.quickTags = payload.quickTags;
        }
        this.save(true);
        return card;
      },

      clearCardStamps(cardId) {
        const card = this.state.cards.find(c => c.id === cardId);
        if (!card) return false;
        card.stamps = {};
        this.save(true);
        return true;
      },

      deleteCard(cardId) {
        if (this.state.cards.length <= 1) return false;
        this.state.cards = this.state.cards.filter(c => c.id !== cardId);
        if (this.state.activeCardId === cardId) {
          this.state.activeCardId = this.state.cards[0].id;
        }
        this.save(true);
        return true;
      },

      resetToDefault() {
        this.state = createDefaultState();
        this.save(true);
      },

      importState(parsed) {
        if (!parsed || !Array.isArray(parsed.cards) || parsed.cards.length === 0) {
          throw new Error('無效的集點卡備份格式');
        }
        this.state = parsed;
        this.save(true);
      }
    };

    // =========================================================================
    // Step 3：蓋章音效 (Web Audio API)、全螢幕慶祝紙花 (Confetti) 與打卡備註彈窗
    // =========================================================================
    const SoundFX = {
      ctx: null,
      ensureCtx() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playStamp() {
        if (!HabitStore.state.soundEnabled) return;
        try {
          this.ensureCtx();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          // 輕快蓋章雙音「啵・咚！」
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(640, now + 0.09);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.15);
        } catch (e) {}
      },
      playUnstamp() {
        if (!HabitStore.state.soundEnabled) return;
        try {
          this.ensureCtx();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(380, now);
          osc.frequency.exponentialRampToValueAtTime(210, now + 0.12);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.14);
        } catch (e) {}
      },
      playCelebrate() {
        if (!HabitStore.state.soundEnabled) return;
        try {
          this.ensureCtx();
          if (!this.ctx) return;
          const notes = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6
          notes.forEach((freq, idx) => {
            const now = this.ctx.currentTime + idx * 0.085;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.3);
          });
        } catch (e) {}
      }
    };

    const ConfettiFX = {
      particles: [],
      animId: null,
      burst() {
        const canvas = document.getElementById('confettiCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const colors = ['#f6cb52', '#e0533c', '#5e8782', '#8eaec0', '#d96b70', '#f39c12', '#2ecc71'];
        for (let i = 0; i < 110; i++) {
          this.particles.push({
            x: canvas.width * (0.25 + Math.random() * 0.5),
            y: canvas.height * 0.35,
            vx: (Math.random() - 0.5) * 16,
            vy: -Math.random() * 14 - 5,
            size: 7 + Math.random() * 7,
            color: colors[i % colors.length],
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 0.25,
            life: 0,
            maxLife: 85 + Math.random() * 35
          });
        }

        if (this.animId) cancelAnimationFrame(this.animId);
        const step = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          this.particles = this.particles.filter(p => p.life < p.maxLife);
          for (const p of this.particles) {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.38; // 重力
            p.vx *= 0.99;
            p.rot += p.vRot;
            p.life++;
            const alpha = Math.max(0, 1 - p.life / p.maxLife);
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
            ctx.restore();
          }
          if (this.particles.length > 0) {
            this.animId = requestAnimationFrame(step);
          } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
          }
        };
        this.animId = requestAnimationFrame(step);
      }
    };

    });

    // =========================================================================
    // 雙人共同打卡身分 & 跨手機自動雲端同步 (CloudSync + BroadcastChannel)
    // =========================================================================
    const CloudSync = {
      bc: typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('habit_stamp_sync_ch') : null,
      pollTimer: null,
      isSyncing: false,

      getEndpoint() {
        const room = (LocalProfile.data.roomId || '').trim();
        let db = (LocalProfile.data.dbUrl || '').trim().replace(/\/+$/, '');
        if (!room || !db) return null;
        return `${db}/habit_rooms/${encodeURIComponent(room)}.json`;
      },

      updateStatusBadge() {
        const badgeText = document.getElementById('profileBadgeText');
        const dot = document.getElementById('syncStatusDot');
        if (badgeText) {
          const roomSuffix = LocalProfile.data.roomId ? ` · #${LocalProfile.data.roomId}` : '';
          badgeText.textContent = `${LocalProfile.data.avatar} ${LocalProfile.data.name}${roomSuffix}`;
        }
        if (dot) {
          dot.classList.toggle('online', Boolean(this.getEndpoint()));
        }
      },

      async push() {
        // 1. 同裝置跨分頁即時同步
        if (this.bc) {
          try {
            this.bc.postMessage({ type: 'STATE_SYNC', state: HabitStore.state });
          } catch (e) {}
        }
        // 2. 跨手機雲端自動推播同步
        const url = this.getEndpoint();
        if (!url) return;
        try {
          await fetch(url, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(HabitStore.state)
          });
        } catch (err) {
          console.warn('雲端同步推播失敗：', err);
        }
      },

      async pull(silent = true) {
        const url = this.getEndpoint();
        if (!url || this.isSyncing) return;
        this.isSyncing = true;
        try {
          const res = await fetch(url, { cache: 'no-store' });
          if (!res.ok) return;
          const remote = await res.json();
          if (remote && Array.isArray(remote.cards) && remote.cards.length > 0) {
            const localTs = HabitStore.state.updatedAt || 0;
            const remoteTs = remote.updatedAt || 0;
            if (remoteTs > localTs) {
              const prevActive = HabitStore.state.activeCardId;
              HabitStore.state = remote;
              if (HabitStore.state.cards.some(c => c.id === prevActive)) {
                HabitStore.state.activeCardId = prevActive;
              }
              HabitStore.save(false);
              renderApp();
              if (!silent) showCelebrationToast('☁️ 已同步最新共同打卡進度！');
            } else if (!localTs && !remoteTs && !silent) {
              showCelebrationToast('☁️ 已連線至共同房間！');
            } else if (localTs > remoteTs) {
              await this.push();
            }
          } else {
            // 雲端房間尚無資料時，將本機初始卡片推上去建立房間
            await this.push();
            if (!silent) showCelebrationToast('☁️ 已建立共同房間並上傳集點卡！');
          }
        } catch (err) {
          if (!silent) showCelebrationToast('⚠️ 無法連線至資料庫網址，請檢查設定');
        } finally {
          this.isSyncing = false;
        }
      },

      startAutoSync() {
        this.updateStatusBadge();
        if (this.bc) {
          this.bc.onmessage = (ev) => {
            if (ev.data?.type === 'STATE_SYNC' && ev.data.state) {
              HabitStore.state = ev.data.state;
              HabitStore.save(false);
              renderApp();
            }
          };
        }
        if (this.pollTimer) clearInterval(this.pollTimer);
        this.pollTimer = setInterval(() => this.pull(true), 3500);
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') this.pull(true);
        });
        if (this.getEndpoint()) {
          this.pull(false);
        }
      }
    };

    // 雙人共同打卡與雲端同步彈窗控制
    let selectedAvatar = '👩';

    function openSyncModal() {
      selectedAvatar = LocalProfile.data.avatar || '👩';
      document.getElementById('profileNameInput').value = LocalProfile.data.name || '我';
      document.getElementById('syncRoomInput').value = LocalProfile.data.roomId || '';
      document.getElementById('syncDbUrlInput').value = LocalProfile.data.dbUrl || '';

      document.querySelectorAll('#profileAvatarPills [data-avatar]').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.avatar === selectedAvatar);
      });

      document.getElementById('syncModalOverlay').classList.add('open');
    }

    function closeSyncModal() {
      document.getElementById('syncModalOverlay').classList.remove('open');
    }

    document.getElementById('toolSyncBtn').addEventListener('click', openSyncModal);
    document.getElementById('btnQuickProfile').addEventListener('click', openSyncModal);
    document.getElementById('btnCloseSyncModal').addEventListener('click', closeSyncModal);
    document.getElementById('btnCancelSyncModal').addEventListener('click', closeSyncModal);
    document.getElementById('syncModalOverlay').addEventListener('click', (e) => {
      if (e.target.id === 'syncModalOverlay') closeSyncModal();
    });

    document.querySelectorAll('#profileAvatarPills [data-avatar]').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedAvatar = btn.dataset.avatar;
        document.querySelectorAll('#profileAvatarPills [data-avatar]').forEach(b => {
          b.classList.toggle('selected', b.dataset.avatar === selectedAvatar);
        });
      });
    });

    document.getElementById('btnSaveSyncModal').addEventListener('click', async () => {
      LocalProfile.data.avatar = selectedAvatar;
      LocalProfile.data.name = document.getElementById('profileNameInput').value.trim() || '我';
      LocalProfile.data.roomId = document.getElementById('syncRoomInput').value.trim();
      LocalProfile.data.dbUrl = document.getElementById('syncDbUrlInput').value.trim();
      LocalProfile.save();

      CloudSync.updateStatusBadge();
      closeSyncModal();
      SoundFX.playStamp();
      if (CloudSync.getEndpoint()) {
        await CloudSync.pull(false);
      } else {
        showCelebrationToast(`👤 已切換打卡身分為「${LocalProfile.data.avatar} ${LocalProfile.data.name}」`);
      }
      renderApp();
    });

    document.getElementById('btnCopyInviteLink').addEventListener('click', async () => {
      const room = document.getElementById('syncRoomInput').value.trim();
      const db = document.getElementById('syncDbUrlInput').value.trim();
      const url = new URL(window.location.href);
      if (room) url.searchParams.set('room', room);
      if (db) url.searchParams.set('db', db);
      try {
        await navigator.clipboard.writeText(url.toString());
        showCelebrationToast('🔗 已複製邀請連結！傳給朋友即可自動連入同一房間');
      } catch (e) {
        prompt('請複製以下邀請連結傳給朋友：', url.toString());
      }
    });

    // 初始化 Profile、Store 與自動同步引擎
    LocalProfile.init();
    HabitStore.init();
    renderApp();
    CloudSync.startAutoSync();
  </script>
</body>
</html>
